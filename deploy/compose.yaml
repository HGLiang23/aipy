name: aipy

x-app-environment: &app-environment
  AIPY_APP_NAME: ${AIPY_APP_NAME:-AIPY API}
  AIPY_ENVIRONMENT: ${AIPY_ENVIRONMENT:-local}
  AIPY_DEBUG: ${AIPY_DEBUG:-false}
  AIPY_LOG_LEVEL: ${AIPY_LOG_LEVEL:-INFO}
  AIPY_API__HOST: 0.0.0.0
  AIPY_API__PORT: 8000
  AIPY_DATABASE__URL: postgresql+psycopg://${AIPY_RUNTIME_USER:?AIPY_RUNTIME_USER is required}:${AIPY_RUNTIME_PASSWORD:?AIPY_RUNTIME_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-aipy}
  AIPY_REDIS__URL: redis://redis:6379/0
  AIPY_CELERY__BROKER_URL: redis://redis:6379/1
  AIPY_STORAGE__ENDPOINT: http://minio:9000
  AIPY_STORAGE__BUCKET: ${MINIO_BUCKET:-aipy}
  AIPY_STORAGE__ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
  AIPY_STORAGE__SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}

x-app-dependencies: &app-dependencies
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio:
    condition: service_healthy
  minio-init:
    condition: service_completed_successfully

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aipy}
      POSTGRES_USER: ${POSTGRES_USER:-aipy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      AIPY_RUNTIME_USER: ${AIPY_RUNTIME_USER:?AIPY_RUNTIME_USER is required}
      AIPY_RUNTIME_PASSWORD: ${AIPY_RUNTIME_PASSWORD:?AIPY_RUNTIME_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-runtime-role.sh:/docker-entrypoint-initdb.d/010-runtime-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: ${MINIO_CLIENT_IMAGE:-minio/mc:RELEASE.2025-04-16T18-13-26Z}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-aipy}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"

  migrate:
    profiles: ["application"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    environment:
      <<: *app-environment
      AIPY_DATABASE__URL: postgresql+psycopg://${POSTGRES_USER:-aipy}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-aipy}
    depends_on: *app-dependencies
    restart: "no"
    command: ["python", "-m", "alembic", "-c", "migrations/alembic.ini", "upgrade", "head"]

  api:
    profiles: ["application"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    restart: unless-stopped
    environment: *app-environment
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    profiles: ["application"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: worker
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - python -m celery -A apps.worker.celery_app:celery_app inspect ping --destination "celery@$${HOSTNAME}" --timeout 5
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  postgres-data:
  redis-data:
  minio-data:
